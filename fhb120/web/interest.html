<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="范皓博的兴趣档案">
  <meta name="robots" content="noindex, nofollow">
  <title>兴趣档案 | 范皓博</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #20211e;
      background-color: #f4f0e8;
      background-image:
        linear-gradient(rgba(35, 55, 110, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35, 55, 110, 0.055) 1px, transparent 1px),
        radial-gradient(circle at 90% 3%, #dce5ff 0, transparent 32%);
      background-size: 72px 72px, 72px 72px, 100% 100%;
      background-attachment: fixed;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      display: flex;
      width: 100%;
      max-width: 1080px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 36px 22px;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 1px solid #c9c4b9;
      color: #77746b;
      font-size: 11px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #20211e;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .logo {
      display: flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border: 1px solid #20211e;
      font-family: Consolas, monospace;
      font-size: 10px;
    }

    .nav {
      display: flex;
      gap: 16px;
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    .nav a {
      color: #77746b;
      transition: color 0.2s;
    }

    .nav a:hover,
    .nav a.active {
      color: #1d3fbd;
    }

    /* 标题 */
    .hero {
      padding: 48px 0 32px;
      border-bottom: 1px solid #c9c4b9;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #1d3fbd;
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: 54px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -2px;
    }

    /* 兴趣卡片 */
    .records {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 26px 0 30px;
      border-bottom: 1px solid #c9c4b9;
    }

    .record {
      min-width: 0;
      border: 1px solid #d2cdc2;
      background: rgba(255, 255, 255, 0.46);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .record:hover {
      border-color: #1d3fbd;
      background: rgba(255, 255, 255, 0.68);
    }

    .record-photo {
      display: flex;
      height: 230px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #e9e5dc;
    }

    .record-photo img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      transition: transform 0.35s ease;
    }

    .record:hover img {
      transform: scale(1.025);
    }

    .record-no {
      margin: 11px 12px 3px;
      color: #1d3fbd;
      font-family: Consolas, monospace;
      font-size: 8px;
      letter-spacing: 0.7px;
    }

    .record h2 {
      margin: 0 12px 13px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
    }

    /* 页脚 */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #c9c4b9;
      color: #8d8a81;
      font-family: Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
    }

    .footer a {
      color: #1d3fbd;
    }

    /* 响应式 */
    @media (max-width: 1000px) {
      .records {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 20px 18px;
      }

      .header {
        font-size: 10px;
      }

      .brand {
        font-size: 11px;
      }

      .nav {
        gap: 7px;
        font-size: 8.5px;
      }

      .hero {
        padding: 34px 0 26px;
      }

      h1 {
        font-size: 40px;
        letter-spacing: -1px;
      }

      .records {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 20px 0 24px;
      }

      .record-photo {
        height: 220px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="../index.html">
        <span class="logo">FH</span>
        <span>范皓博</span>
      </a>
      <nav class="nav" aria-label="页面导航">
        <a href="../index.html">首页</a>
        <a href="study.html">学习轨迹</a>
        <a href="life.html">生活切片</a>
        <a class="active" href="interest.html" aria-current="page">兴趣档案</a>
        <a href="words.html">想说的话</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">INTEREST ARCHIVE / 04</p>
        <h1>兴趣档案</h1>
      </section>

      <section class="records" aria-label="兴趣档案图片">
        <a class="record" href="../image/record/friend.jpg" target="_blank" rel="noopener" aria-label="查看猫猫朋友原图">
          <div class="record-photo">
            <img src="../image/record/friend.jpg" alt="猫咪表情包" width="600" height="600">
          </div>
          <p class="record-no">01 / FRIEND</p>
          <h2>“智慧的棉花”</h2>
        </a>

        <a class="record" href="../image/record/game.png" target="_blank" rel="noopener" aria-label="查看 Apex 英雄原图">
          <div class="record-photo">
            <img src="../image/record/game.png" alt="Apex 英雄标志" width="1400" height="933">
          </div>
          <p class="record-no">02 / GAME</p>
          <h2>Delta Force</h2>
        </a>

        <a class="record" href="../image/record/drink.jpg" target="_blank" rel="noopener" aria-label="查看太妃榛香拿铁原图">
          <div class="record-photo">
            <img src="../image/record/drink.jpg" alt="太妃榛香拿铁商品图" width="904" height="352">
          </div>
          <p class="record-no">03 / DRINK</p>
          <h2>太妃榛香拿铁</h2>
        </a>

        <a class="record" href="../image/record/music.jpg" target="_blank" rel="noopener" aria-label="查看 Essence 原图">
          <div class="record-photo">
            <img src="../image/record/music.jpg" alt="Essence 单曲封面" width="1400" height="1400">
          </div>
          <p class="record-no">04 / MUSIC</p>
          <h2>Essence</h2>
        </a>
      </section>
    </main>

    <footer class="footer">
      <a href="../index.html">← 返回个人主页</a>
      <span>{"status": "curious", "next": "explore"}</span>
      <span>© 2026 范皓博</span>
    </footer>
  </div>
</body>
</html>
